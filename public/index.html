<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flight Monitor — 机票价格监控</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0f172a; --surface: #1e293b; --surface2: #334155;
      --text: #f1f5f9; --text2: #94a3b8; --accent: #38bdf8;
      --green: #4ade80; --yellow: #fbbf24; --red: #f87171;
      --border: #475569; --radius: 12px;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--bg); color: var(--text); line-height: 1.6;
      min-height: 100vh;
    }
    .container { max-width: 960px; margin: 0 auto; padding: 20px; }
    header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 20px 0; border-bottom: 1px solid var(--border); margin-bottom: 24px;
    }
    header h1 { font-size: 24px; display: flex; align-items: center; gap: 8px; }
    header .status { font-size: 13px; color: var(--text2); }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); display: inline-block; }

    /* Stats cards */
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .stat-card {
      background: var(--surface); border-radius: var(--radius); padding: 20px;
      border: 1px solid var(--border);
    }
    .stat-card .label { font-size: 13px; color: var(--text2); margin-bottom: 4px; }
    .stat-card .value { font-size: 28px; font-weight: 700; }
    .stat-card .value.green { color: var(--green); }
    .stat-card .value.accent { color: var(--accent); }

    /* Add route form */
    .add-form {
      background: var(--surface); border-radius: var(--radius); padding: 24px;
      border: 1px solid var(--border); margin-bottom: 24px;
    }
    .add-form h2 { font-size: 18px; margin-bottom: 16px; }
    .form-row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
    .form-row input, .form-row select {
      flex: 1; min-width: 120px; padding: 10px 14px; border-radius: 8px;
      border: 1px solid var(--border); background: var(--surface2); color: var(--text);
      font-size: 14px; outline: none;
    }
    .form-row input:focus, .form-row select:focus { border-color: var(--accent); }
    .form-row input::placeholder { color: var(--text2); }
    .btn {
      padding: 10px 24px; border-radius: 8px; border: none; cursor: pointer;
      font-size: 14px; font-weight: 600; transition: all 0.2s;
    }
    .btn-primary { background: var(--accent); color: #0f172a; }
    .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn-danger { background: transparent; color: var(--red); border: 1px solid var(--red); }
    .btn-danger:hover { background: var(--red); color: white; }
    .btn-sm { padding: 6px 14px; font-size: 12px; }

    /* Routes list */
    .routes-section h2 { font-size: 18px; margin-bottom: 16px; }
    .route-card {
      background: var(--surface); border-radius: var(--radius); padding: 20px;
      border: 1px solid var(--border); margin-bottom: 12px;
      transition: border-color 0.2s;
    }
    .route-card:hover { border-color: var(--accent); }
    .route-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .route-title { font-size: 18px; font-weight: 600; }
    .route-id { color: var(--text2); font-size: 13px; }
    .route-meta { display: flex; gap: 20px; color: var(--text2); font-size: 14px; flex-wrap: wrap; }
    .route-meta span { display: flex; align-items: center; gap: 4px; }
    .route-prices { margin-top: 16px; }
    .price-bar {
      display: flex; align-items: center; gap: 12px; padding: 8px 0;
      border-top: 1px solid var(--border);
    }
    .price-bar:first-child { border-top: none; }
    .price-amount { font-size: 18px; font-weight: 700; min-width: 80px; }
    .price-amount.low { color: var(--green); }
    .price-amount.typical { color: var(--yellow); }
    .price-amount.high { color: var(--red); }
    .price-airline { color: var(--text2); font-size: 13px; }
    .price-time { color: var(--text2); font-size: 13px; }
    .route-actions { display: flex; gap: 8px; margin-top: 12px; }

    /* Chart area */
    .chart-area {
      background: var(--surface); border-radius: var(--radius); padding: 20px;
      border: 1px solid var(--border); margin-top: 12px;
    }
    canvas { width: 100% !important; height: 200px !important; }

    /* Empty state */
    .empty {
      text-align: center; padding: 60px 20px; color: var(--text2);
    }
    .empty .icon { font-size: 48px; margin-bottom: 12px; }

    /* Loading */
    .loading { text-align: center; padding: 40px; color: var(--text2); }
    .spinner { display: inline-block; width: 24px; height: 24px; border: 3px solid var(--border);
      border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Toast */
    .toast {
      position: fixed; bottom: 20px; right: 20px; padding: 12px 20px;
      background: var(--green); color: #0f172a; border-radius: 8px;
      font-weight: 600; font-size: 14px; z-index: 100;
      transform: translateY(100px); opacity: 0; transition: all 0.3s;
    }
    .toast.show { transform: translateY(0); opacity: 1; }

    /* Auth modal */
    .auth-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.7);
      display: flex; align-items: center; justify-content: center; z-index: 50;
    }
    .auth-box {
      background: var(--surface); border-radius: var(--radius); padding: 32px;
      max-width: 400px; width: 90%; border: 1px solid var(--border);
    }
    .auth-box h2 { margin-bottom: 8px; }
    .auth-box p { color: var(--text2); margin-bottom: 20px; font-size: 14px; }
    .auth-box input {
      width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--surface2); color: var(--text); font-size: 16px; margin-bottom: 16px;
    }

    @media (max-width: 640px) {
      .form-row { flex-direction: column; }
      .form-row input, .form-row select { min-width: 100%; }
      .stats { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>

<div class="container" id="app">
  <!-- Auth screen -->
  <div class="auth-overlay" id="authScreen">
    <div class="auth-box">
      <h2>✈️ Flight Monitor</h2>
      <p>输入你的 Telegram Chat ID 登录查看监控数据。<br>
      不知道 Chat ID？在 Telegram 给 Bot 发 /start 就会显示。</p>
      <input type="text" id="chatIdInput" placeholder="Telegram Chat ID" autofocus>
      <button class="btn btn-primary" style="width:100%" onclick="login()">登录</button>
    </div>
  </div>

  <!-- Main dashboard -->
  <div id="dashboard" style="display:none">
    <header>
      <h1>✈️ Flight Monitor</h1>
      <div class="status">
        <span class="status-dot"></span> 每6小时自动查价
        <span style="margin-left:12px;cursor:pointer" onclick="logout()">🚪 退出</span>
      </div>
    </header>

    <!-- Stats -->
    <div class="stats">
      <div class="stat-card">
        <div class="label">监控航线</div>
        <div class="value accent" id="statRoutes">-</div>
      </div>
      <div class="stat-card">
        <div class="label">价格记录</div>
        <div class="value" id="statRecords">-</div>
      </div>
      <div class="stat-card">
        <div class="label">低价告警</div>
        <div class="value green" id="statAlerts">-</div>
      </div>
      <div class="stat-card">
        <div class="label">当前最低价</div>
        <div class="value green" id="statLowest">-</div>
      </div>
    </div>

    <!-- Add route -->
    <div class="add-form">
      <h2>➕ 添加监控航线</h2>
      <div class="form-row">
        <select id="inputOrigin">
          <option value="NGB">宁波 NGB</option>
          <option value="HGH">杭州 HGH</option>
          <option value="PVG">上海浦东 PVG</option>
          <option value="SHA">上海虹桥 SHA</option>
        </select>
        <input type="text" id="inputDest" placeholder="目的地 (如 SYX / 三亚)">
      </div>
      <div class="form-row">
        <input type="date" id="inputDateFrom" placeholder="开始日期">
        <input type="date" id="inputDateTo" placeholder="结束日期">
        <input type="number" id="inputPrice" placeholder="最高价 (¥)">
      </div>
      <div class="form-row">
        <button class="btn btn-primary" onclick="addRoute()">添加监控</button>
        <button class="btn" style="background:var(--surface2)" onclick="triggerCheck()">🔍 立即查价</button>
      </div>
    </div>

    <!-- Routes list -->
    <div class="routes-section">
      <h2>📋 监控列表</h2>
      <div id="routesList">
        <div class="loading"><div class="spinner"></div><br>加载中...</div>
      </div>
    </div>
  </div>
</div>

<!-- Toast notification -->
<div class="toast" id="toast"></div>

<script>
const API_BASE = '';
let chatId = localStorage.getItem('fm_chat_id') || '';

// Airport names mapping
const AIRPORTS = {
  NGB: '宁波', HGH: '杭州', PVG: '上海浦东', SHA: '上海虹桥',
  SYX: '三亚', KMG: '昆明', CTU: '成都', CKG: '重庆', KWE: '贵阳',
  XMN: '厦门', HAK: '海口', JHG: '西双版纳', LJG: '丽江', DLU: '大理',
  KWL: '桂林', XIY: '西安', HRB: '哈尔滨', CSX: '长沙', NNG: '南宁',
  BKK: '曼谷', DMK: '曼谷廊曼', CNX: '清迈', SGN: '胡志明',
  DAD: '岘港', KUL: '吉隆坡', SIN: '新加坡', DPS: '巴厘岛',
  MNL: '马尼拉', CEB: '宿务', NRT: '东京', KIX: '大阪', ICN: '首尔',
};

function airportName(code) {
  return AIRPORTS[code] ? `${AIRPORTS[code]}(${code})` : code;
}

function init() {
  if (chatId) {
    document.getElementById('authScreen').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    loadData();
  }
  // Set default dates to next month
  const now = new Date();
  const next = new Date(now.getFullYear(), now.getMonth() + 1, 1);
  const lastDay = new Date(now.getFullYear(), now.getMonth() + 2, 0);
  document.getElementById('inputDateFrom').value = next.toISOString().split('T')[0];
  document.getElementById('inputDateTo').value = lastDay.toISOString().split('T')[0];
}

function login() {
  chatId = document.getElementById('chatIdInput').value.trim();
  if (!chatId) return;
  localStorage.setItem('fm_chat_id', chatId);
  document.getElementById('authScreen').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
  loadData();
}

function logout() {
  localStorage.removeItem('fm_chat_id');
  chatId = '';
  location.reload();
}

async function loadData() {
  try {
    const resp = await fetch(`${API_BASE}/api/routes?chat_id=${chatId}`);
    const data = await resp.json();
    if (data.error) {
      document.getElementById('routesList').innerHTML =
        '<div class="empty"><div class="icon">📭</div>还没有监控航线<br>先在上面添加一条，或在 Telegram 给 Bot 发消息</div>';
      updateStats([], []);
      return;
    }
    const routes = data.routes || [];
    renderRoutes(routes);

    // Load prices for each route
    let allRecords = [];
    let allAlerts = 0;
    for (const r of routes) {
      const priceResp = await fetch(`${API_BASE}/api/prices?route_id=${r.id}`);
      const priceData = await priceResp.json();
      r._prices = priceData.prices || [];
      allRecords = allRecords.concat(r._prices);
    }
    renderRoutes(routes);
    updateStats(routes, allRecords);
  } catch (err) {
    console.error(err);
    document.getElementById('routesList').innerHTML =
      '<div class="empty"><div class="icon">❌</div>加载失败，请检查网络</div>';
  }
}

function updateStats(routes, records) {
  document.getElementById('statRoutes').textContent = routes.length;
  document.getElementById('statRecords').textContent = records.length;

  const prices = records.map(r => r.price).filter(p => p > 0);
  const lowest = prices.length > 0 ? Math.min(...prices) : '-';
  document.getElementById('statLowest').textContent = lowest !== '-' ? `¥${lowest}` : '-';

  // Alerts count (placeholder)
  document.getElementById('statAlerts').textContent = routes.filter(r =>
    r._prices && r._prices.some(p => p.price_level === 'low')
  ).length;
}

function renderRoutes(routes) {
  if (routes.length === 0) {
    document.getElementById('routesList').innerHTML =
      '<div class="empty"><div class="icon">✈️</div>添加你的第一条监控航线吧</div>';
    return;
  }

  let html = '';
  for (const r of routes) {
    const origin = airportName(r.origin);
    const dest = r.destination ? airportName(r.destination) : '任意';
    const prices = r._prices || [];
    const lowestPrice = prices.length > 0 ? Math.min(...prices.map(p => p.price)) : null;

    html += `<div class="route-card">
      <div class="route-header">
        <div class="route-title">✈️ ${origin} → ${dest}</div>
        <div class="route-id">#${r.id}</div>
      </div>
      <div class="route-meta">
        <span>📅 ${r.date_from} ~ ${r.date_to}</span>
        <span>💰 阈值 ¥${r.max_price}</span>
        <span>👤 ${r.adults}大${r.children > 0 ? r.children + '小' : ''}</span>
        ${r.last_checked_at ? `<span>🕐 ${r.last_checked_at.slice(5,16)}</span>` : ''}
      </div>`;

    if (prices.length > 0) {
      // Show unique cheapest prices
      const seen = new Set();
      const unique = prices.filter(p => {
        const key = `${p.airline}-${p.price}`;
        if (seen.has(key)) return false;
        seen.add(key);
        return true;
      }).slice(0, 5);

      html += '<div class="route-prices">';
      for (const p of unique) {
        const levelClass = p.price_level === 'low' ? 'low' : p.price_level === 'high' ? 'high' : 'typical';
        const levelDot = p.price_level === 'low' ? '🟢' : p.price_level === 'high' ? '🔴' : '🟡';
        html += `<div class="price-bar">
          <div class="price-amount ${levelClass}">¥${p.price}</div>
          <div class="price-airline">${levelDot} ${p.airline || '未知'} ${p.flight_number || ''}</div>
          <div class="price-time">${p.departure_time ? p.departure_time.slice(11,16) : ''} ${p.source}</div>
        </div>`;
      }
      html += '</div>';
    }

    html += `<div class="route-actions">
      <button class="btn btn-sm" style="background:var(--surface2)" onclick="refreshRoute(${r.id})">🔄 刷新</button>
      <button class="btn btn-sm btn-danger" onclick="deleteRoute(${r.id})">删除</button>
    </div></div>`;
  }

  document.getElementById('routesList').innerHTML = html;
}

async function addRoute() {
  const origin = document.getElementById('inputOrigin').value;
  let dest = document.getElementById('inputDest').value.trim().toUpperCase();
  const dateFrom = document.getElementById('inputDateFrom').value;
  const dateTo = document.getElementById('inputDateTo').value;
  const maxPrice = document.getElementById('inputPrice').value;

  if (!dest || !dateFrom || !dateTo || !maxPrice) {
    showToast('请填写完整信息', 'var(--red)');
    return;
  }

  // Try to resolve Chinese city names
  for (const [code, name] of Object.entries(AIRPORTS)) {
    if (dest === name || dest.includes(name)) { dest = code; break; }
  }

  try {
    const resp = await fetch(`${API_BASE}/api/add-route`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ chat_id: chatId, origin, destination: dest, date_from: dateFrom, date_to: dateTo, max_price: parseInt(maxPrice) })
    });
    const data = await resp.json();
    if (data.error) { showToast(data.error, 'var(--red)'); return; }
    showToast('监控已添加！');
    document.getElementById('inputDest').value = '';
    document.getElementById('inputPrice').value = '';
    loadData();
  } catch (err) {
    showToast('添加失败', 'var(--red)');
  }
}

async function deleteRoute(id) {
  if (!confirm(`确定删除监控 #${id}？`)) return;
  try {
    await fetch(`${API_BASE}/api/delete-route`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ chat_id: chatId, route_id: id })
    });
    showToast('已删除');
    loadData();
  } catch (err) {
    showToast('删除失败', 'var(--red)');
  }
}

async function refreshRoute(id) {
  showToast('正在查询...');
  try {
    await fetch(`${API_BASE}/trigger-check`, { method: 'POST' });
    setTimeout(loadData, 3000);
    showToast('查询已触发，稍等几秒刷新');
  } catch (err) {
    showToast('触发失败', 'var(--red)');
  }
}

async function triggerCheck() {
  showToast('正在查询所有航线...');
  try {
    await fetch(`${API_BASE}/trigger-check`, { method: 'POST' });
    setTimeout(loadData, 5000);
  } catch (err) {
    showToast('触发失败', 'var(--red)');
  }
}

function showToast(msg, bg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.background = bg || 'var(--green)';
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 3000);
}

init();
</script>
</body>
</html>
